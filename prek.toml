# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"

default_install_hook_types = [
  "pre-commit",
  "commit-msg",
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "pretty-format-json" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"
hooks = [{ id = "codespell" }]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"] }]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker"
rev = "v3.11.1"
hooks = [{ id = "editorconfig-checker" }]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.2"
hooks = [{ id = "markdownlint-cli2" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.4.1"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "local"
hooks = [
  {
    id = "lint-rules",
    name = "Lint rules",
    entry = "python scripts/lint.py",
    language = "system",
    pass_filenames = false,
  },
  {
    id = "build-skill",
    name = "Build SKILL.md",
    entry = "python scripts/build.py",
    language = "system",
    pass_filenames = false,
  },
]
